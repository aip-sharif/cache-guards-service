# Service names are short (api / redis / postgres) so DSNs and hostnames read
# cleanly; container names are all prefixed `semantic-cache-` so they are easy
# to spot in `docker ps`.
#
# This stack has two halves:
#   - semantic-cache: api / redis / postgres  -> the cache + gateway itself
#   - app:            app-db / app            -> the APP that mints/validates
#     client keys and serves SC_APP_CONFIG_URL (reachable on the network via
#     the `app-config` alias below). This is the same "APP" referenced in the
#     api service's env comments.
services:
  # The API service: SaaS cache routes + the OpenAI-compatible gateway.
  # Whole stack:            docker compose up -d --build
  # ...with local Postgres: docker compose --profile local-pg up -d --build
  api:
    build:
      context: ./cache_as_service
      dockerfile: Dockerfile
    container_name: semantic-cache-api
    # Host port is configurable; the app always listens on 8080 in-container.
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SC_REDIS_HOST: redis
      # Read the Redis port from the environment (see .env / REDIS_PORT),
      # defaulting to 6379. Must match what the redis service binds below.
      SC_REDIS_PORT: "${REDIS_PORT:-6379}"
      SC_REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD — an unauthenticated Redis holds every tenant's cached completions}"
      SC_EXACT_TIER: "true"
      # Embeddings are API-based (OpenRouter / mlops / any OpenAI-compatible
      # endpoint) — no local model in the image. This shared embedder serves
      # the SaaS tenant caches; the gateway uses per-project embed models
      # from the APP. Defaults to the gateway's mlops embed endpoint.
      SC_EMBEDDING_PROVIDER: "${SC_EMBEDDING_PROVIDER:-custom_api}"
      SC_EMBEDDING_BASE_URL: "${SC_EMBEDDING_BASE_URL:-${SC_EMBED_BASE_URL:-}}"
      SC_EMBEDDING_API_KEY: "${SC_EMBEDDING_API_KEY:-}"
      SC_EMBEDDING_MODEL: "${SC_EMBEDDING_MODEL:-}"
      SC_LOG_LEVEL: "${SC_LOG_LEVEL:-INFO}"
      SC_ENVIRONMENT: "${SC_ENVIRONMENT:-production}"
      # Error reporting (optional). Set SC_SENTRY_DSN in your .env to enable.
      SC_SENTRY_DSN: "${SC_SENTRY_DSN:-}"
      SC_SENTRY_TRACES_SAMPLE_RATE: "${SC_SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      # OpenAI-compatible gateway (optional). Mounts /v1/chat/completions when
      # ALL FOUR are set: an existing Postgres, the APP's config endpoint, and
      # the mlops chat + embedding endpoints. The APP mints and validates the
      # client keys — this service never does, so there is no admin/mint token
      # for the gateway.
      SC_PG_DSN: "${SC_PG_DSN:-}"
      SC_APP_CONFIG_URL: "${SC_APP_CONFIG_URL:-}"
      SC_APP_CONFIG_TTL: "${SC_APP_CONFIG_TTL:-60}"
      SC_APP_CONFIG_MAX_ENTRIES: "${SC_APP_CONFIG_MAX_ENTRIES:-10000}"
      SC_LLM_BASE_URL: "${SC_LLM_BASE_URL:-}"
      SC_EMBED_BASE_URL: "${SC_EMBED_BASE_URL:-}"
      SC_EXTRACTOR_BASE_URL: "${SC_EXTRACTOR_BASE_URL:-}"
      # Input guard (optional). Whether a client is guarded — and with which
      # embedding/judge models — comes from the APP's config response, so the
      # guard adds NO required variable here. These are operator limits and
      # break-glass only. The guard is deliberately NOT wired into the
      # healthcheck below: with restart: unless-stopped, a judge outage would
      # otherwise become a container restart loop.
      SC_GUARD_ENABLED: "${SC_GUARD_ENABLED:-true}"
      SC_GUARD_TIMEOUT: "${SC_GUARD_TIMEOUT:-5.0}"
      SC_GUARD_BUILD_TIMEOUT: "${SC_GUARD_BUILD_TIMEOUT:-60.0}"
      SC_GUARD_MAX_EXEMPLARS: "${SC_GUARD_MAX_EXEMPLARS:-5000}"
      SC_GUARD_MAX_POLICY_BYTES: "${SC_GUARD_MAX_POLICY_BYTES:-262144}"
      SC_GUARD_CACHE_MAX_BYTES: "${SC_GUARD_CACHE_MAX_BYTES:-268435456}"
      SC_GUARD_SEGMENT_MEMO_SIZE: "${SC_GUARD_SEGMENT_MEMO_SIZE:-50000}"
      # Both fall back to SC_EMBED_BASE_URL / SC_LLM_BASE_URL when unset.
      SC_GUARD_EMBED_BASE_URL: "${SC_GUARD_EMBED_BASE_URL:-}"
      SC_GUARD_JUDGE_BASE_URL: "${SC_GUARD_JUDGE_BASE_URL:-}"
      # Bearer for the SaaS multi-tenant admin routes (tenant creation) and
      # for scraping /metrics — NOT used by the OpenAI gateway. Unset → SaaS
      # admin disabled and /metrics answers 503.
      SC_ADMIN_API_KEY: "${SC_ADMIN_API_KEY:-}"
      # Pepper for API-key lookup fingerprints. Without it a stolen Redis
      # snapshot lets an attacker confirm a guessed key offline. Existing keys
      # migrate to the peppered fingerprint the next time they are used.
      SC_API_KEY_PEPPER: "${SC_API_KEY_PEPPER:?set SC_API_KEY_PEPPER to a long random string — see README}"
      # SSO. Unset → JWT bearers are REJECTED and only minted sc-... keys work.
      SC_SSO_JWKS_URL: "${SC_SSO_JWKS_URL:-}"
      SC_SSO_SHARED_SECRET: "${SC_SSO_SHARED_SECRET:-}"
      SC_SSO_ISSUER: "${SC_SSO_ISSUER:-}"
      SC_SSO_AUDIENCE: "${SC_SSO_AUDIENCE:-}"
      SC_MAX_REQUEST_BYTES: "${SC_MAX_REQUEST_BYTES:-1048576}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # /health is LIVENESS: it checks nothing external, so a Redis blip cannot
    # turn `restart: unless-stopped` into a restart loop. Dependency state is
    # at /ready, for your orchestrator's readiness probe.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    # One uvicorn worker by design (see Dockerfile) — the guard matrices, the
    # segment memo and the APP-config cache are all per-process. Size for one
    # process and scale with replicas.
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2}"
          memory: ${API_MEMORY:-2g}
    security_opt:
      - no-new-privileges:true
    networks:
      - shared_net

  redis:
    # Pinned by digest. `latest` meant the datastore under a multi-tenant cache
    # could change major version between two `docker compose up` runs.
    image: redis/redis-stack-server:7.4.0-v5@sha256:bf3ee511b24c952341d357039e2d706617fa9f34f633696d0b1fef42df02f375
    container_name: semantic-cache-redis
    # NOT published. Reachable only on the compose network. The override file
    # publishes it for local work.
    expose:
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    # --requirepass replaces `--protected-mode no`. Protected mode was disabled
    # because it refuses non-loopback clients on an unauthenticated instance —
    # the fix for that is a password, not turning the guard off. With
    # requirepass set, protected mode accepts the app container and still
    # refuses anonymous connections.
    #
    # --appendonly yes: AOF, every write logged.
    # --save 60 1: RDB snapshot if >=1 key changed in 60s (backups).
    command: >
      redis-server
      --port ${REDIS_PORT:-6379}
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/rejson.so
      --appendonly yes
      --save 60 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - shared_net

  # An ordinary Postgres so the stack runs with no external database. It
  # stores the gateway's projects + hashed keys, the message log, and the
  # cache backup. Match it in .env:
  #   SC_PG_DSN=postgresql://scuser:scpass@postgres:5432/sccache
  # (host = the SERVICE name `postgres`, and always port 5432 — the
  # in-container port; PG_PORT only changes what is published to your host.)
  # In PRODUCTION, point SC_PG_DSN at your OWN Postgres and remove this
  # service (or don't publish PG_PORT).
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: semantic-cache-postgres
    environment:
      POSTGRES_USER: scuser
      # No default. The old `scpass` was a published credential on a published
      # port; Compose now refuses to start rather than reuse it.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — it is the password for every tenant's message log}"
      POSTGRES_DB: sccache
    # NOT published. The override file publishes it for local work.
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scuser -d sccache"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - shared_net

  # --- APP (the config/keys service the gateway above talks to) ---

  # Postgres for the APP. Renamed to `app-db` (was `db`) to avoid colliding
  # with the semantic-cache `postgres` service above — both stacks are now
  # in one file. Uses its own custom port 1379 as in the original app compose.
  app-db:
    image: postgres:15
    container_name: cache-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-p", "1379"]
    ports:
      - "1379:1379"
    volumes:
      - app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 1379"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared_net

  # The APP itself. Renamed to `app` (was `api`) to avoid colliding with the
  # semantic-cache `api` service above. Keeps its `app-config` network alias
  # so the semantic-cache api's SC_APP_CONFIG_URL keeps resolving.
  app:
    build: ./cache_api
    container_name: cache-app
    restart: unless-stopped
    env_file:
      - ./cache_api/.env
    environment:
      POSTGRES_HOST: app-db
    ports:
      - "8000:8000"
    depends_on:
      app-db:
        condition: service_healthy
    volumes:
      - ./cache_api:/code
    networks:
      shared_net:
        aliases:
          - app-config

# Persistent volumes. Even if a container is destroyed, the data lives on the
# host (Docker named-volume driver): Redis replays its AOF/RDB on next start,
# and Postgres keeps its tables.
volumes:
  redis_data:
    driver: local
  pg_data:
    driver: local
  app_pgdata:
    driver: local

networks:
  shared_net:
    external: true