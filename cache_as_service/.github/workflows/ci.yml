name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# WHERE THIS FILE LIVES MATTERS. GitHub Actions only discovers workflows in
# `.github/workflows/` at the REPOSITORY ROOT. When this project is vendored
# into a monorepo as a subdirectory, this file stops being discovered and CI
# goes quiet without failing — see Docs/GUARD_HANDOFF.md §11.
permissions:
  contents: read

jobs:
  # Unit tests only: no Redis, no embedding model, no network. Runs on a bare
  # runner across the supported Python matrix in seconds. `pytest` collects
  # tests/unit/ (see pyproject testpaths).
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # fastapi + postgres are needed to COLLECT the gateway suite:
      # tests/unit/test_gateway_router_unit.py imports fastapi at module scope.
      # sso is here so the JWKS branch of jwt_auth is importable; the HS* path
      # it mainly exercises needs nothing.
      - name: Install (core + async + fastapi + postgres + metrics + translate + sso + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[async,fastapi,postgres,metrics,translate,sso,dev]"

      - name: Run unit tests
        run: pytest -v

  # Separated from the matrix: coverage is a property of the code, not of the
  # interpreter, so measuring it four times only makes four numbers to argue
  # about. The floor is a RATCHET — raise it when it rises, never lower it to
  # make a red build green.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[async,fastapi,postgres,metrics,translate,sso,dev]"
      - name: pytest --cov (fails under the floor)
        run: pytest --cov=semantic_cache --cov-report=term-missing --cov-fail-under=70

  # No --exit-zero. A linter that cannot fail a build is a log file.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff==0.6.9
      - name: ruff check
        run: ruff check semantic_cache tests

  # Proves the image still builds and, more importantly, that it RUNS: an
  # image whose entrypoint cannot import its own app is a green build and a
  # crash-looping deploy. See A06 — the metrics extra was missing from the
  # image for months without CI noticing.
  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t semantic-cache-ci:${{ github.sha }} .
      - name: The app imports inside the image
        run: |
          docker run --rm semantic-cache-ci:${{ github.sha }} \
            python -c "from semantic_cache.server import create_app; print('import ok')"
      - name: Every extra the image claims is actually installed
        run: |
          docker run --rm semantic-cache-ci:${{ github.sha }} python -c "
          import prometheus_client, fastapi, httpx, psycopg, sentry_sdk
          print('extras ok')"
