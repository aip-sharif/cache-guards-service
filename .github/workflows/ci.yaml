name: CI

on:
  push:
    branches: [main, devlop]
  pull_request:
    branches: [main, devlop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache_api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cache_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . --exit-zero

      - name: Check Python syntax (compile all files)
        run: python -m compileall -q app main.py

      - name: Build Docker image
        run: docker build --build-arg BASE_IMAGE=python:3.10-slim -t caching-service:ci .

  semantic-cache:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache_as_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the service image (python:3.12-slim in cache_as_service/Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache_as_service/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[async,fastapi,postgres,metrics,translate,dev]" ruff

      # Strict on purpose: pyproject.toml's [tool.ruff] is the rule set.
      - name: Lint with ruff
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Build Docker image
        run: docker build -t semantic-cache:ci .

  # اگه بعداً تست‌های واقعی (pytest) اضافه کردید، این job رو فعال کنید:
  # test:
  #   runs-on: ubuntu-latest
  #   needs: lint-and-build
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.10"
  #     - run: pip install -r requirements.txt pytest
  #     - run: pytest