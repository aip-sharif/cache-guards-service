name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . --exit-zero

      - name: Check Python syntax (compile all files)
        run: python -m compileall -q app main.py

      - name: Build Docker image
        run: docker build -t caching-service:ci .

  # اگه بعداً تست‌های واقعی (pytest) اضافه کردید، این job رو فعال کنید:
